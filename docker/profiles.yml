nba_stats:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'build_dev') }}"
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"
      sslmode: "{{ env_var('PGSSLMODE', 'disable') }}"
      connect_timeout: 10
