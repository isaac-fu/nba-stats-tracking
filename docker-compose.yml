services:
  db:
    image: postgres:18.6
    container_name: nba-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: nba_stats
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres_data_v18: